name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-version: '3.1'
            activesupport: '~> 6.1.0'
          - ruby-version: '3.2'
            activesupport: '~> 7.2.0'
          - ruby-version: '3.3'
            activesupport: '~> 8.0.0'
          - ruby-version: '3.4'
            activesupport: '~> 8.1.0'
          - ruby-version: '4.0'
            activesupport: '~> 8.1.0'
    env:
      ACTIVESUPPORT_VERSION: ${{ matrix.activesupport }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake spec
